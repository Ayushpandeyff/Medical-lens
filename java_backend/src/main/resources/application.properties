# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800

# CORS and Security
server.servlet.session.cookie.path=/


# ML Service Configuration
ml.service.url=http://localhost:5000
ml.service.timeout=30000
ml.service.retry=3

# CORS Configuration - Updated to fix credentials issue
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://127.0.0.1:5501
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Accept,Accept-Language,Content-Language,Content-Type,Authorization,X-Requested-With,Cache-Control
app.cors.allow-credentials=true

# Logging Configuration
logging.level.com.fakenews.detector=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.indent-output=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Configuration
app.name=Fake News Detector
app.version=1.0.0
app.description=AI-powered fake news detection platform

# Performance Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Development Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
